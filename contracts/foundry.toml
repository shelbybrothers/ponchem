[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
optimizer = true
# 10,000 runs: the constant optimizer then emits the scorer's 32-byte masks as plain PUSH32 instead of
# PUSH+NOT/SHL pairs, which the visit loop executes thousands of times per run
optimizer_runs = 10000
via_ir = true
evm_version = "cancun"
# The default Yul sequence minus "i" (FullInliner): with it, the scorer's single-use Yul functions were flattened
# into one body whose live variables exceeded the stack, so the stack-limit evader moved the visit loop into memory
# (every read an MLOAD, r2 recomputed three times) and a run cost 4.1M gas instead of 2.9M. The hot loops of the
# lab and of the check are all Yul, so nothing of note is left for the inliner. Sourcify records these settings.
optimizer_details = { yul = true, yulDetails = { stackAllocation = true, optimizerSteps = "dhfoDgvulfnTUtnf[xa[r]EscLMcCTUtTOntnfDIulLculVcul [j]Tpeulxa[rul]xa[r]cL gvf CTUca[r]LSsTFOtfDnca[r]Iulc] jmul[jul] VcTOcul jmul:fDnTOcmu" } }
# read-write inside the project (deploy records, gas.md, out/rehearsal), read-only on the shared data:
# the engine test vectors, the frozen tables, and the registry with its pocket and topology bytes
fs_permissions = [{ access = "read-write", path = "./" }, { access = "read", path = "../data" }]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[rpc_endpoints]
# the Robinhood Chain relay contracts/script/lib/shell.sh looks for (resolve_rpc); RPC_URL overrides it
rhood = "http://127.0.0.1:8670"

[lint]
lint_on_build = false
